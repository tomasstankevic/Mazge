[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_deps =
    blynkkk/Blynk@^1.3.2
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DJPEG_CROP_USE_PSRAM

[env:ota]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_deps =
    blynkkk/Blynk@^1.3.2
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DJPEG_CROP_USE_PSRAM
upload_protocol = espota
upload_port = 192.168.0.41
upload_flags =
    --timeout=120

# Bench-debug env: USB-CDC enabled so Serial.print shows up on /dev/cu.usbmodem*
# without an external UART bridge. Same firmware otherwise.
[env:bench]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct, time
board_build.arduino.memory_type = qio_opi
lib_deps =
    blynkkk/Blynk@^1.3.2
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DJPEG_CROP_USE_PSRAM
    -DBENCH_BUILD=1
